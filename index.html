<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub File Uploader & Downloader</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { max-width: 800px; margin: 30px auto; padding: 20px; background-color: #f4f7f6; color: #333; }
        .card { background: white; padding: 25px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); margin-bottom: 20px; }
        h2 { margin-top: 0; color: #2c3e50; }
        label { display: block; margin: 10px 0 5px; font-weight: bold; }
        input[type="text"], input[type="password"], input[type="file"], textarea { width: 100%; padding: 10px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 5px; }
        textarea { resize: vertical; min-height: 100px; }
        button { background-color: #2ea44f; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-size: 16px; font-weight: bold; }
        button:hover { background-color: #2c974b; }
        .btn-note { background-color: #6f42c1; width: 100%; text-align: center; }
        .btn-note:hover { background-color: #5a32a3; }
        .file-list { list-style: none; padding: 0; }
        .file-item { display: flex; justify-content: space-between; align-items: center; padding: 12px; border-bottom: 1px solid #eee; background: #fafafa; margin-bottom: 5px; border-radius: 5px; }
        .download-btn { background-color: #0969da; color: white; text-decoration: none; padding: 6px 12px; border-radius: 4px; font-size: 14px; }
        .download-btn:hover { background-color: #085cc5; }
        #status, #noteStatus { margin-top: 10px; font-weight: bold; }
        #noteContentArea { display: none; margin-top: 15px; }
    </style>
</head>
<body>

    <div class="card">
        <h2>1. Pengaturan Repository & Token</h2>
        <label>Username GitHub:</label>
        <input type="text" id="username" placeholder="contoh: user123">
        
        <label>Nama Repository:</label>
        <input type="text" id="repo" placeholder="contoh: file-storage">
        
        <label>GitHub Personal Access Token (PAT):</label>
        <input type="password" id="token" placeholder="ghp_xxxxxxxxxxxx">
        
        <button onclick="saveConfig()">Simpan & Muat File</button>
    </div>

    <div class="card">
        <h2>2. Upload File Baru</h2>
        <input type="file" id="fileInput">
        <button onclick="uploadFile()">Upload Ke GitHub</button>
        <div id="status"></div>
    </div>

    <div class="card">
        <h2>3. Daftar File Berhasil Diupload</h2>
        <ul id="fileList" class="file-list">
            <li><em>Masukkan pengaturan di atas terlebih dahulu untuk memuat file.</em></li>
        </ul>
    </div>

    <!-- BAGIAN REVISI: CATATAN PEMBUAT -->
    <div class="card">
        <h2>4. Catatan Pembuat Web</h2>
        <button id="btnOpenNote" class="btn-note" onclick="accessNote()">🔓 Buka Catatan Pembuat</button>
        
        <div id="noteContentArea">
            <label>Isi Catatan Pembuat:</label>
            <textarea id="noteText" placeholder="Tulis catatan Anda di sini..."></textarea>
            <button onclick="saveNote()">Simpan Catatan</button>
            <div id="noteStatus"></div>
        </div>
    </div>

    <script>
        // Password Rahasia
        const ADMIN_PASSWORD = "reyhanstudio";

        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('username').value = localStorage.getItem('gh_user') || '';
            document.getElementById('repo').value = localStorage.getItem('gh_repo') || '';
            document.getElementById('token').value = localStorage.getItem('gh_token') || '';
            
            if (localStorage.getItem('gh_user') && localStorage.getItem('gh_repo')) {
                fetchFiles();
            }
        });

        function saveConfig() {
            const user = document.getElementById('username').value.trim();
            const repo = document.getElementById('repo').value.trim();
            const token = document.getElementById('token').value.trim();

            localStorage.setItem('gh_user', user);
            localStorage.setItem('gh_repo', repo);
            localStorage.setItem('gh_token', token);

            alert('Pengaturan disimpan!');
            fetchFiles();
        }

        async function uploadFile() {
            const user = localStorage.getItem('gh_user');
            const repo = localStorage.getItem('gh_repo');
            const token = localStorage.getItem('gh_token');
            const fileInput = document.getElementById('fileInput');
            const status = document.getElementById('status');

            if (!user || !repo || !token) {
                alert('Harap lengkapi Username, Repository, dan Token terlebih dahulu!');
                return;
            }

            if (fileInput.files.length === 0) {
                alert('Pilih file terlebih dahulu!');
                return;
            }

            const file = fileInput.files[0];
            const filePath = `uploads/${file.name}`;
            status.innerText = 'Mengunggah file...';
            status.style.color = 'blue';

            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = async function () {
                const content = reader.result.split(',')[1];

                try {
                    let sha = '';
                    const checkUrl = `https://api.github.com/repos/${user}/${repo}/contents/${filePath}`;
                    const checkRes = await fetch(checkUrl, {
                        headers: { 'Authorization': `token ${token}` }
                    });
                    if (checkRes.ok) {
                        const checkData = await checkRes.json();
                        sha = checkData.sha;
                    }

                    const response = await fetch(checkUrl, {
                        method: 'PUT',
                        headers: {
                            'Authorization': `token ${token}`,
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            message: `Upload ${file.name} via Web`,
                            content: content,
                            sha: sha || undefined
                        })
                    });

                    if (response.ok) {
                        status.innerText = 'File berhasil diupload!';
                        status.style.color = 'green';
                        fileInput.value = '';
                        fetchFiles();
                    } else {
                        const errData = await response.json();
                        status.innerText = 'Gagal upload: ' + errData.message;
                        status.style.color = 'red';
                    }
                } catch (err) {
                    status.innerText = 'Terjadi kesalahan jaringan!';
                    status.style.color = 'red';
                }
            };
        }

        async function fetchFiles() {
            const user = localStorage.getItem('gh_user');
            const repo = localStorage.getItem('gh_repo');
            const token = localStorage.getItem('gh_token');
            const fileListEl = document.getElementById('fileList');

            if (!user || !repo) return;

            fileListEl.innerHTML = '<li>Memuat file...</li>';

            try {
                const headers = token ? { 'Authorization': `token ${token}` } : {};
                const response = await fetch(`https://api.github.com/repos/${user}/${repo}/contents/uploads`, { headers });

                if (!response.ok) {
                    if(response.status === 404) {
                        fileListEl.innerHTML = '<li>Folder "uploads" belum ada. Upload file pertama Anda!</li>';
                    } else {
                        fileListEl.innerHTML = '<li>Gagal mengambil file. Cek pengaturan repository Anda.</li>';
                    }
                    return;
                }

                const data = await response.json();
                fileListEl.innerHTML = '';

                data.forEach(item => {
                    // Kecualikan file admin_note.txt agar tidak tampil di daftar unduhan biasa
                    if (item.type === 'file' && item.name !== 'admin_note.txt' && item.name !== '.gitkeep') {
                        const li = document.createElement('li');
                        li.className = 'file-item';
                        const downloadUrl = item.download_url;

                        li.innerHTML = `
                            <span><strong>${item.name}</strong> (${(item.size / 1024).toFixed(1)} KB)</span>
                            <a href="${downloadUrl}" class="download-btn" target="_blank" download>Download</a>
                        `;
                        fileListEl.appendChild(li);
                    }
                });

                if (fileListEl.children.length === 0) {
                    fileListEl.innerHTML = '<li>Belum ada file publik di folder uploads.</li>';
                }

            } catch (err) {
                fileListEl.innerHTML = '<li>Gagal menghubungkan ke GitHub API.</li>';
            }
        }

        // FUNGSI UNTUK AKSES DAN SIMPAN CATATAN
        function accessNote() {
            const inputPass = prompt("Masukkan Password untuk membuka Catatan Pembuat:");
            if (inputPass === ADMIN_PASSWORD) {
                document.getElementById('noteContentArea').style.display = 'block';
                document.getElementById('btnOpenNote').style.display = 'none';
                loadNote();
            } else if (inputPass !== null) {
                alert("Password Salah!");
            }
        }

        async function loadNote() {
            const user = localStorage.getItem('gh_user');
            const repo = localStorage.getItem('gh_repo');
            const token = localStorage.getItem('gh_token');
            const noteText = document.getElementById('noteText');

            if (!user || !repo) {
                noteText.value = "Pengaturan repository belum lengkap.";
                return;
            }

            try {
                const headers = token ? { 'Authorization': `token ${token}` } : {};
                const res = await fetch(`https://api.github.com/repos/${user}/${repo}/contents/uploads/admin_note.txt`, { headers });
                
                if (res.ok) {
                    const data = await res.json();
                    // Decode base64 utf-8
                    const content = decodeURIComponent(escape(atob(data.content)));
                    noteText.value = content;
                } else {
                    noteText.value = ""; // Jika file catatan belum dibuat
                }
            } catch (err) {
                console.log("Gagal memuat catatan:", err);
            }
        }

        async function saveNote() {
            const user = localStorage.getItem('gh_user');
            const repo = localStorage.getItem('gh_repo');
            const token = localStorage.getItem('gh_token');
            const noteText = document.getElementById('noteText').value;
            const noteStatus = document.getElementById('noteStatus');

            if (!user || !repo || !token) {
                alert('Lengkapi Username, Repo, dan Token terlebih dahulu!');
                return;
            }

            noteStatus.innerText = 'Menyimpan catatan...';
            noteStatus.style.color = 'blue';

            try {
                const filePath = `uploads/admin_note.txt`;
                let sha = '';
                
                const checkRes = await fetch(`https://api.github.com/repos/${user}/${repo}/contents/${filePath}`, {
                    headers: { 'Authorization': `token ${token}` }
                });
                
                if (checkRes.ok) {
                    const checkData = await checkRes.json();
                    sha = checkData.sha;
                }

                // Encode string ke base64
                const contentEncoded = btoa(unescape(encodeURIComponent(noteText)));

                const response = await fetch(`https://api.github.com/repos/${user}/${repo}/contents/${filePath}`, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `token ${token}`,
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        message: `Update catatan pembuat`,
                        content: contentEncoded,
                        sha: sha || undefined
                    })
                });

                if (response.ok) {
                    noteStatus.innerText = 'Catatan berhasil disimpan!';
                    noteStatus.style.color = 'green';
                } else {
                    noteStatus.innerText = 'Gagal menyimpan catatan.';
                    noteStatus.style.color = 'red';
                }
            } catch (err) {
                noteStatus.innerText = 'Terjadi kesalahan jaringan!';
                noteStatus.style.color = 'red';
            }
        }
    </script>
</body>
</html>
